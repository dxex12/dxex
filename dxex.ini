; =============================================================================
; dxex.ini - Configuration Profile for dxex
; =============================================================================

[dxex]

# Controls pipeline state caching.
# Supported values: True, False
# enableStateCache = True

# Number of compiler threads.
# Set to 0 to use all available CPU cores.
# numCompilerThreads = 0

# Enables ENB Series compatibility.
# When false (default), disabled enb
# Supported values: True, False
# enb = False



[d3d9]

# Defers swap chain surface creation until the first Present call.
# Supported values: True, False
# deferSurfaceCreation = False

# Enforces a maximum frame latency (0 to disable override).
# Supported values: 0 - 16
# maxFrameLatency = 0

# Frame rate limiter (0 = display refresh rate, -1 = disabled).
# Supported values: -1, 0, or any target FPS
# maxFrameRate = 0

# Override reported PCI vendor and device IDs (hex).
# customDeviceId = 0000
# customVendorId = 0000

# Override reported GPU device description string.
# customDeviceDesc = ""

# Report Nvidia GPUs as AMD to avoid vendor-specific issues.
# Supported values: Auto, True, False
# hideNvidiaGpu = Auto

# Report AMD GPUs as Nvidia to avoid vendor-specific issues.
# Supported values: Auto, True, False
# hideAmdGpu = Auto

# Report Intel GPUs as AMD to circumvent legacy iGPU limitations.
# Supported values: Auto, True, False
# hideIntelGpu = True

# Overrides presentation Vsync interval (0 disables Vsync).
# Supported values: 0 (off), 1 (60Hz), 2 (30Hz), -1 (game default)
# presentInterval = -1

# Overrides anisotropic filtering level for all samplers (0 to disable).
# Supported values: -1 (game default), 0 - 16
# samplerAnisotropy = -1

# Adjusts texture mipmap LOD bias.
# Supported values: -2.0 to 1.0
# samplerLodBias = 0.0

# Clamps negative texture LOD bias to zero.
# Supported values: True, False
# clampNegativeLodBias = False

# Ensures identical position calculations to eliminate multipass Z-fighting.
# Supported values: True, False
# invariantPosition = True

# Forces per-sample pixel shading when MSAA is enabled.
# Supported values: True, False
# forceSampleRateShading = False

# Generates deterministic D3D12 command streams between identical runs.
# Supported values: True, False
# reproducibleCommandStream = False

# Overrides reported maximum Direct3D 9 shader model capability.
# Supported values: 0 (fixed-function), 1, 2, 3
# shaderModel = 3

# Sets process DPI awareness to avoid upscaling blur on Hi-DPI monitors.
# Supported values: True, False
# dpiAware = True

# Enforces strict constant buffer copying during relative indexing.
# Supported values: True, False
# strictConstantCopies = False

# Evaluates pow(x, 0) and pow(0, 0) as 1.0 to prevent GPU driver NaNs.
# Supported values: True, False
# strictPow = True

# Fastpaths render target clears that almost cover the full target.
# Supported values: True, False
# lenientClear = False

# Maximum texture memory reported by GetAvailableTextureMem (in MB).
# maxAvailableMemory = 4096

# Fails allocations when tracked virtual memory is exhausted.
# Supported values: True, False
# memoryTrackTest = False

# Controls floating point quirk emulation (e.g. anything * 0 = 0).
# Supported values: Auto, True, False, Strict
# floatEmulation = Auto

# Emulates sin/cos instructions using high-precision polynomial series.
# Supported values: Auto, True, False
# sincosEmulation = Auto

# Overrides swapchain multisample antialiasing count (-1 = application default).
# Supported values: -1, 0, 2, 4, 8, 16
# forceSwapchainMSAA = -1

# Allocates D3D9 constant buffers in device-local VRAM rather than host memory.
# Supported values: True, False
# deviceLocalConstantBuffers = False

# Enables vendor extension DF16 and DF24 depth formats on AMD/Intel.
# Supported values: True, False
# supportDFFormats = True

# Forces 32-bit float depth buffer format instead of 24-bit.
# Supported values: True, False
# useD32forD24 = False

# Enables legacy X4R4G4B4 texture format support.
# Supported values: True, False
# supportX4R4G4B4 = True

# Disables support for A8 format render targets.
# Supported values: True, False
# disableA8RT = False

# Resolves sampler type mismatches (2D vs Cube vs 3D) in legacy shaders.
# Supported values: True, False
# forceSamplerTypeSpecConstants = False

# Filters display mode enumeration to a specific aspect ratio (e.g. "16:9", "4:3").
# forceAspectRatio = ""

# Enumerates D3D9 adapters per display monitor rather than per physical GPU.
# Supported values: True, False
# enumerateByDisplays = True

# Allocates dynamic vertex/index buffers in CPU-cached memory for faster CPU readbacks.
# Supported values: True, False
# cachedDynamicBuffers = False

# Forces seamless cubemap filtering across cube edges.
# Supported values: True, False
# seamlessCubes = False

# Virtual memory unmapping budget for textures in MB (0 to disable unmapping).
# textureMemory = 100

# Triggers D3DERR_DEVICELOST when the game window loses focus in fullscreen.
# Supported values: True, False
# deviceLossOnFocusLoss = False

# Rejects Device::Reset if losable D3DPOOL_DEFAULT resources are still alive.
# Supported values: True, False
# countLosableResources = True

# Adds a shadow frontbuffer for games expecting GetFrontBufferData on single-buffer swapchains.
# Supported values: True, False
# extraFrontbuffer = False
